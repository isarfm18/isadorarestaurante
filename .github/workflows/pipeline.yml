name: integracao continua

on:
  push:
    branches: ["develop", "staging"]
  pull_request:
    branches: ["develop"]

jobs:
  estagio_build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v6

      - name: Configurar Node.js 18
        uses: actions/setup-node@v6
        with:
          node-version: "18"
          package-manager-cache: false

      - name: Gerar lockfile temporário
        run: npm install --package-lock-only

      - name: Instalar dependências
        run: npm install

      - name: Verificar sintaxe de todos os arquivos JS
        run: |
          find . -type f -name "*.js" \
            ! -path "./node_modules/*" \
            ! -path "./.git/*" \
            ! -path "./dist/*" \
            -exec node --check {} \;

  estagio_lint:
    runs-on: ubuntu-latest
    needs: estagio_build
    steps:
      - name: Checkout do código
        uses: actions/checkout@v6

      - name: Configurar Node.js 18
        uses: actions/setup-node@v6
        with:
          node-version: "18"
          package-manager-cache: false

      - name: Gerar lockfile temporário
        run: npm install --package-lock-only

      - name: Instalar dependências
        run: npm install

      - name: Instalar dependências temporárias do lint
        run: npm install --no-save eslint globals

      - name: Criar configuração temporária do ESLint
        run: |
          cat > eslint.config.js <<'EOF'
          const globals = require("globals");

          module.exports = [
            {
              files: ["**/*.js"],
              ignores: ["node_modules/**", ".git/**", "dist/**"],
              languageOptions: {
                ecmaVersion: 2021,
                sourceType: "commonjs",
                globals: {
                  ...globals.node,
                  ...globals.commonjs
                }
              },
              rules: {
                "no-unused-vars": "warn",
                "no-undef": "error"
              }
            }
          ];
          EOF

      - name: Rodar lint
        run: npx eslint .

  job_sonar:
    needs: estagio_lint
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]' && github.ref != 'refs/heads/staging'
    steps:
      - name: Checkout do código
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Criar sonar-project.properties
        run: |
          cat > sonar-project.properties <<'EOF'
          sonar.projectKey=isadorarestaurante
          sonar.projectName=isadorarestaurante
          sonar.sources=.
          sonar.inclusions=**/*.js
          sonar.sourceEncoding=UTF-8
          sonar.exclusions=node_modules/**,.git/**,.github/**,coverage/**,dist/**
          EOF

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.TOKEN_SONAR }}
          SONAR_HOST_URL: "https://devsecops.dcotech.com.br"

  job_release_docker:
    needs: estagio_lint
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v6

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build e Push da Imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/isadorarestaurante:staging
            ${{ secrets.DOCKER_USERNAME }}/isadorarestaurante:${{ github.sha }}

  job_trivy_sonar:
    needs: job_release_docker
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código para o Sonar
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan de Segurança com Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKER_USERNAME }}/isadorarestaurante:${{ github.sha }}'
          format: 'template'
          template: '@/contrib/sonarqube.tpl'
          output: 'trivy-report.json'

      - name: Criar sonar-project.properties com Trivy external issues
        run: |
          cat > sonar-project.properties <<'EOF'
          sonar.projectKey=isadorarestaurante
          sonar.projectName=isadorarestaurante
          sonar.sources=.
          sonar.inclusions=**/*.js
          sonar.sourceEncoding=UTF-8
          sonar.exclusions=node_modules/**,.git/**,.github/**,coverage/**,dist/**
          sonar.externalIssuesReportPaths=trivy-report.json
          EOF

      - name: SonarQube lendo o Trivy (External Issues)
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.TOKEN_SONAR }}
          SONAR_HOST_URL: "https://devsecops.dcotech.com.br"
