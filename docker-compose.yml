services:
  db:
    image: mysql:8.0
    container_name: isadorarestaurante-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: isadoradb
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3307:3306"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - db-data:/var/lib/mysql
    networks:
      - app-network

  app:
    image: isarfm18/isadorarestaurante:latest
    build: .
    container_name: isadorarestaurante-app
    ports:
      - "8087:3000"  
    environment:
      DB_HOST: db
      DB_PORT: 3306  
      DB_USER: user
      DB_PASS: password
      DB_NAME: isadoradb
    depends_on:
      - db
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db-data: