services:
  db:
    image: mysql:8.0
    container_name: isadorarestaurante-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: isadoradb
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3307:3306"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: isadorarestaurante-app
    ports:
      - "3001:3000"  
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: user
      DB_PASS: password
      DB_NAME: isadoradb
    depends_on:
      db:
        condition: service_healthy
